<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - مطعم الفرسان</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #201512 0%, #A61C1C 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      padding: 40px;
      text-align: center;
    }

    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #201512 0%, #A61C1C 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .login-container h1 {
      color: #201512;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .login-container p {
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: right;
    }

    .form-group label {
      display: block;
      color: #201512;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: #A61C1C;
      box-shadow: 0 0 0 3px rgba(166, 28, 28, 0.1);
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #201512 0%, #A61C1C 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(166, 28, 28, 0.3);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      color: #A61C1C;
      margin-bottom: 20px;
      font-size: 14px;
      padding: 10px;
      background: #ffe0e0;
      border-radius: 6px;
      display: none;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: #A61C1C;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">🛡️</div>
    <h1>لوحة التحكم</h1>
    <p>أدخل كلمة المرور للوصول إلى لوحة الإدارة</p>

    <div class="error-message" id="error-message"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">اسم المستخدم</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="أدخل اسم المستخدم"
          required
          autofocus
        />
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="أدخل كلمة المرور"
          required
        />
      </div>
      <button type="submit" class="login-button" id="login-button">
        دخول
      </button>
    </form>

    <a href="/" class="back-link">← العودة إلى الموقع</a>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const errorMessage = document.getElementById("error-message");
    const loginButton = document.getElementById("login-button");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMessage.style.display = "none";
      loginButton.disabled = true;
      loginButton.textContent = "جاري المحاولة...";

      try {
        const response = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            username: usernameInput.value, 
            password: passwordInput.value 
          }),
        });

        if (!response.ok) {
          throw new Error("اسم المستخدم أو كلمة المرور غير صحيحة");
        }

        const data = await response.json();
        localStorage.setItem("admin_token", data.token);
        window.location.href = "/admin.html";
      } catch (err) {
        errorMessage.textContent = err.message || "حدث خطأ، حاول مرة أخرى";
        errorMessage.style.display = "block";
        loginButton.disabled = false;
        loginButton.textContent = "دخول";
        usernameInput.focus();
      }
    });
  </script>
</body>
</html>
